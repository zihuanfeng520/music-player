<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GitHub Music Player</title>
    
    <link rel="icon" href="./picture/logo.png" type="image/png">
    <link rel="apple-touch-icon" href="./picture/logo.png">
    <link rel="manifest" href="./manifest.json">

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <style>
        /* --- 全局變數 --- */
        :root {
            --primary-color: #ffb703;
            --bg-color: #121212;
            --text-main: #ffffff;
            --text-sub: #b3b3b3;
            --menu-bg: #333333;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            user-select: none;
        }

        /* 隱藏元素 (用於 PiP) */
        .hidden-media {
            position: absolute; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; z-index: -100;
        }

        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.5s;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid #333;
            border-top: 4px solid var(--primary-color); border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #app-container { width: 100%; height: 100%; position: relative; }

        /* --- 列表頁面 --- */
        #list-view {
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            background: linear-gradient(180deg, #1e1e2e 0%, #000000 100%);
            padding-bottom: calc(80px + env(safe-area-inset-bottom));
            position: absolute; top: 0; left: 0;
            z-index: 10;
        }

        .nav-bar {
            padding: 20px; display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(10px);
        }
        .nav-title { font-size: 20px; font-weight: 700; }
        .icon-btn { background: none; border: none; color: white; cursor: pointer; padding: 8px; }

        /* 分頁切換 */
        .tab-header {
            display: flex; justify-content: center; align-items: center;
            background: rgba(0,0,0,0.3); padding: 10px 0;
        }
        .tab-item {
            padding: 8px 20px; font-size: 15px; color: var(--text-sub);
            cursor: pointer; position: relative; transition: color 0.3s;
        }
        .tab-item.active { color: var(--text-main); font-weight: bold; }
        .tab-item.active::after {
            content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 20px; height: 3px; background: var(--primary-color); border-radius: 2px;
        }

        /* 搜尋欄 */
        .search-container { padding: 10px 20px; display: flex; justify-content: center; }
        .search-box {
            position: relative; width: 100%; background: rgba(255, 255, 255, 0.1);
            border-radius: 8px; display: flex; align-items: center;
        }
        .search-icon { position: absolute; left: 10px; color: #aaa; font-size: 20px; }
        .search-input {
            width: 100%; background: transparent; border: none; color: white;
            padding: 10px 10px 10px 40px; font-size: 14px; outline: none;
        }
        .search-input::placeholder { color: #666; }

        .menu-options {
            position: absolute; top: 60px; right: 10px;
            background: #333; border-radius: 8px; padding: 10px;
            display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 100;
        }
        .menu-options.show { display: block; }
        .menu-item { 
            padding: 12px 20px; color: white; cursor: pointer; font-size: 14px; 
            display: flex; align-items: center; justify-content: space-between; 
        }
        .menu-item:hover { background: #444; }
        
        .status-text { font-weight: bold; font-size: 12px; padding: 2px 6px; border-radius: 4px; }
        .status-on { color: #000; background: var(--primary-color); }
        .status-off { color: #aaa; background: #444; }

        .shuffle-header {
            padding: 10px 20px; display: flex; align-items: center; color: var(--primary-color);
            font-weight: bold; cursor: pointer;
        }
        .shuffle-header span { margin-left: 10px; }

        .song-list { flex: 1; overflow-y: auto; padding: 0 20px; }
        .song-item {
            display: flex; align-items: center; padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer;
            position: relative;
        }
        .song-cover-thumb { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; margin-right: 15px; }
        .song-info-list { flex: 1; min-width: 0; overflow: hidden; }
        .song-title-list { font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; }
        .song-artist-list { font-size: 13px; color: var(--text-sub); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-actions { display: flex; align-items: center; }
        .fav-icon { color: #666; margin-left: 10px; }
        .fav-icon.active { color: #ff4757; }

        /* 浮動選單 */
        .context-menu {
            position: fixed; background-color: var(--menu-bg);
            border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            width: 160px; display: none; z-index: 999; overflow: hidden;
            animation: popIn 0.2s ease-out;
        }
        @keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        .context-item { padding: 12px 15px; color: white; font-size: 14px; display: flex; align-items: center; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .context-item:last-child { border-bottom: none; }
        .context-item:hover { background-color: #444; }
        .context-item span.material-icons-round { margin-right: 10px; font-size: 18px; color: #ccc; }
        .context-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 998; display: none; }

        /* 迷你播放器 */
        .mini-player {
            position: absolute; bottom: 0; left: 0; width: 100%;
            height: calc(70px + env(safe-area-inset-bottom));
            padding-bottom: env(safe-area-inset-bottom);
            background: #222; border-top: 1px solid #333;
            display: flex; align-items: center; padding-left: 15px; padding-right: 15px;
            cursor: pointer; z-index: 20;
        }
        .mini-info { flex: 1; margin: 0 15px; overflow: hidden; }
        
        /* 跑馬燈 */
        .scroll-text { display: inline-block; white-space: nowrap; }
        .scroll-text.scrolling { padding-left: 100%; animation: marquee 12s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

        .mini-title { font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; }
        .mini-artist { font-size: 12px; color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mini-controls button { font-size: 32px; color: white; background: none; border: none; }

        /* --- 播放器頁面 --- */
        #player-view {
            width: 100%; height: 100%; position: absolute; top: 0; left: 0;
            background: #000; display: flex; flex-direction: column;
            transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
            z-index: 50; overflow: hidden;
        }
        #player-view.active { transform: translateY(0); }
        #player-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            filter: blur(40px) brightness(0.4); z-index: -1;
            transition: background-image 0.5s ease;
        }

        .player-nav { padding: 20px; display: flex; justify-content: space-between; align-items: center; color: white; }
        .player-nav .placeholder-btn { width: 40px; height: 40px; }
        
        #header-clock { font-size: 16px; font-weight: 500; letter-spacing: 1px; }

        .vinyl-area { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; }
        
        .tone-arm {
            position: absolute; top: 50%; left: 50%;
            margin-left: 120px; margin-top: -160px;
            width: 40px; height: 150px;
            transform-origin: 50% 12px; 
            transform: rotate(-35deg); /* CSS 預設休息角度 */
            transition: transform 0.2s linear; 
            z-index: 10; pointer-events: none; 
        }
        
        .tone-arm::before {
            content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 24px; height: 24px; border-radius: 50%;
            background: linear-gradient(145deg, #e6e6e6, #999999); border: 2px solid #555;
            box-shadow: 0 3px 6px rgba(0,0,0,0.6); z-index: 2;
        }
        .tone-arm::after {
            content: ''; position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
            width: 8px; height: 115px;
            background: linear-gradient(90deg, #d0d0d0, #a0a0a0, #d0d0d0);
            border-radius: 0 0 4px 4px; border-bottom: 20px solid #666;
            border-left: 2px solid transparent; border-right: 2px solid transparent;
            box-shadow: inset 0 -3px 8px rgba(0,0,0,0.4); z-index: 1;
        }

        .vinyl-record {
            width: 280px; height: 280px; background: radial-gradient(#111 50%, #000 51%);
            border-radius: 50%; border: 8px solid rgba(255,255,255,0.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center;
            animation: rotate 10s linear infinite; animation-play-state: paused; position: relative;
        }
        .vinyl-record.playing { animation-play-state: running; }
        .vinyl-record::before {
            content: ''; position: absolute; width: 95%; height: 95%; border-radius: 50%;
            background: repeating-radial-gradient(#111 0, #111 2px, #222 3px, #222 4px); z-index: 1;
        }
        
        .album-art {
            width: 180px; height: 180px; border-radius: 50%; background-size: cover; background-position: center;
            z-index: 2; position: relative; box-shadow: 0 0 0 5px #111;
        }

        /* CD 中間的挖空效果 */
        .album-art::after {
            content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 30px; height: 30px; background-color: var(--bg-color);
            border-radius: 50%; box-shadow: inset 0 2px 5px rgba(0,0,0,0.8); z-index: 10;
        }

        @keyframes rotate { 100% { transform: rotate(360deg); } }

        .player-controls-area { 
            padding: 30px; padding-bottom: calc(30px + env(safe-area-inset-bottom));
            display: flex; flex-direction: column; 
        }
        .player-info { text-align: center; margin-bottom: 20px; overflow: hidden; }
        .player-title { font-size: 24px; font-weight: bold; margin-bottom: 5px; white-space: nowrap; overflow: hidden; }
        .player-artist { font-size: 16px; color: #ccc; }
        .player-album { font-size: 14px; color: #ccc; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .progress-bar-container { width: 100%; margin-bottom: 20px; }
        .time-labels { display: flex; justify-content: space-between; font-size: 12px; color: #ddd; margin-top: 5px;}
        
        input[type="range"] {
            width: 100%; height: 4px; background: rgba(255,255,255,0.3);
            border-radius: 2px; -webkit-appearance: none; outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 12px; height: 12px;
            background: #fff; border-radius: 50%; cursor: pointer;
        }

        .main-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .ctrl-btn { background: none; border: none; color: white; cursor: pointer; position: relative; padding: 10px; }
        
        .play-pause-btn {
            width: 70px; height: 70px; background: white; border-radius: 50%;
            color: black; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 5px 15px rgba(255,255,255,0.3);
        }
        .material-icons-round { font-size: 28px; }
        .play-pause-btn .material-icons-round { font-size: 40px; }
        #player-fav-btn.active { color: #ff4757; }

        /* 音量浮動視窗 */
        .volume-container { position: relative; display: flex; justify-content: center; align-items: center; }
        .volume-popup {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 140px; height: 50px; background: rgba(34, 34, 34, 0.9); 
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 25px; display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); z-index: 60;
        }
        .volume-popup.show { opacity: 1; bottom: 60px; pointer-events: auto; }
        
        .horizontal-slider-popup { 
            width: 100px !important; height: 4px; background: rgba(255,255,255,0.3); 
            border-radius: 2px; -webkit-appearance: none; outline: none; margin: 0; 
        }
        .horizontal-slider-popup::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: #fff; border-radius: 50%; cursor: pointer; box-shadow: 0 0 5px rgba(0,0,0,0.5); }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 200; display: none; justify-content: center; align-items: center; }
        .modal-box { background: #222; width: 85%; max-width: 320px; border-radius: 15px; padding: 20px; color: white; box-shadow: 0 5px 20px rgba(0,0,0,0.5); }
        .modal-title { font-size: 18px; font-weight: bold; margin-bottom: 20px; text-align: center; }
        
        .timer-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .timer-btn { background: #333; border: 1px solid #444; color: white; padding: 12px; border-radius: 8px; cursor: pointer; }
        .timer-btn.active { background: var(--primary-color); color: black; font-weight: bold; }
        #timer-display { text-align: center; margin-top: 15px; color: var(--primary-color); font-size: 14px; }
        
        .eq-sliders { display: flex; justify-content: space-between; height: 150px; }
        .eq-band { display: flex; flex-direction: column; align-items: center; width: 18%; }
        
        /* EQ 直立滑桿 */
        .eq-range { 
            -webkit-appearance: none; appearance: none;
            writing-mode: vertical-lr; direction: rtl;
            width: 8px !important; height: 100% !important;
            background: #444; border-radius: 4px; cursor: pointer; margin: 0;
        }
        .eq-range::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: #fff; border-radius: 50%; cursor: pointer; }

        .eq-label { font-size: 10px; color: #aaa; margin-top: 10px; }
        .eq-reset { width: 100%; margin-top: 20px; padding: 10px; background: #333; color: white; border: none; border-radius: 8px; cursor: pointer; }
        #btn-timer.active { color: var(--primary-color); }

        .empty-tips { text-align: center; color: #666; margin-top: 50px; font-size: 14px; }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="spinner"></div>
        <div id="loading-text">正在讀取 GitHub 倉庫...</div>
    </div>

    <canvas id="pip-canvas" width="512" height="512" class="hidden-media"></canvas>
    <video id="pip-video" playsinline class="hidden-media"></video>

    <div id="app-container">
        
        <div id="list-view">
            <div class="nav-bar">
                <span class="material-icons-round" style="opacity:0">menu</span>
                <div class="nav-title">音樂播放器</div>
                <button class="icon-btn" onclick="toggleMenu()"><span class="material-icons-round">more_vert</span></button>
                <div class="menu-options" id="menu-options">
                    <div class="menu-item" onclick="toggleDataSaver()">
                        <span>節省流量模式</span>
                        <span id="data-saver-status" class="status-off">OFF</span>
                    </div>
                    
                    <div class="menu-item" onclick="exportFavorites()">導出最愛列表</div>
                    <label class="menu-item" style="display:block">
                        導入最愛列表
                        <input type="file" id="import-file" style="display:none" onchange="importFavorites(this)">
                    </label>
                </div>
            </div>

            <div class="tab-header">
                <div class="tab-item active" id="tab-all" onclick="switchTab('all')">全部歌曲</div>
                <div class="tab-item" id="tab-fav" onclick="switchTab('fav')">我的最愛</div>
            </div>

            <div class="search-container">
                <div class="search-box">
                    <span class="material-icons-round search-icon">search</span>
                    <input type="text" class="search-input" placeholder="搜尋歌名、歌手或專輯..." oninput="filterSongs(this.value)">
                </div>
            </div>

            <div class="shuffle-header" onclick="playRandom()">
                <span class="material-icons-round">shuffle</span>
                <span>隨機播放</span>
            </div>

            <div class="song-list" id="song-list-container"></div>

            <div class="mini-player" id="mini-player" onclick="openPlayer()">
                <img src="" class="song-cover-thumb" id="mini-cover">
                <div class="mini-info">
                    <div class="mini-title" id="mini-title">未播放</div>
                    <div class="mini-artist" id="mini-artist">請選擇歌曲</div>
                </div>
                <div class="mini-controls">
                    <button onclick="event.stopPropagation(); togglePlay()">
                        <span class="material-icons-round" id="mini-play-icon">play_arrow</span>
                    </button>
                </div>
            </div>

            <div id="context-overlay" class="context-overlay" onclick="hideContextMenu()"></div>
            <div id="context-menu" class="context-menu">
                <div class="context-item" id="ctx-fav-btn" onclick="fnToggleFavList()">
                    <span class="material-icons-round" id="ctx-fav-icon">favorite_border</span>
                    <span id="ctx-fav-text">加入最愛</span>
                </div>
                <div class="context-item" onclick="fnPlayNext()"><span class="material-icons-round">playlist_play</span> 下一首播放</div>
                <div class="context-item" onclick="fnDownload()"><span class="material-icons-round">download</span> 下載</div>
                <div class="context-item" onclick="fnRemove()" style="color: #ff6b6b;"><span class="material-icons-round" style="color: #ff6b6b;">delete</span> 移除</div>
            </div>
        </div>

        <div id="player-view">
            <div id="player-bg"></div>
            <div class="player-nav">
                <button class="icon-btn" onclick="closePlayer()"><span class="material-icons-round">keyboard_arrow_down</span></button>
                <span id="header-clock">--:--</span>
                <div class="placeholder-btn"></div>
            </div>
            <div class="vinyl-area">
                <div class="tone-arm" id="tone-arm"></div>
                <div class="vinyl-record" id="vinyl-record">
                    <div class="album-art" id="player-cover"></div>
                </div>
            </div>
            <div class="player-controls-area">
                <div class="player-info">
                    <div class="player-title" id="player-title">Song Title</div>
                    <div class="player-artist" id="player-artist">Unknown Artist</div>
                    <div class="player-album" id="player-album"></div>
                </div>

                <div class="main-controls" style="justify-content: space-around; align-items: center; margin-bottom: 20px; padding: 0 10px;">
                    <button class="ctrl-btn" id="player-fav-btn" onclick="toggleFavorite()">
                        <span class="material-icons-round">favorite_border</span>
                    </button>
                    <button class="ctrl-btn" onclick="openEQ()">
                        <span class="material-icons-round">graphic_eq</span>
                    </button>
                    <div class="volume-container">
                        <div class="volume-popup" id="volume-popup">
                            <input type="range" class="horizontal-slider-popup" min="0" max="1" step="0.01" value="1" oninput="setVolume(this.value)">
                        </div>
                        <button class="ctrl-btn" onclick="toggleVolumePopup()">
                            <span class="material-icons-round">volume_up</span>
                        </button>
                    </div>
                    
                    <button class="ctrl-btn" onclick="togglePiP()">
                        <span class="material-icons-round">picture_in_picture_alt</span>
                    </button>

                    <button class="ctrl-btn" id="btn-timer" onclick="openTimer()">
                        <span class="material-icons-round">timer</span>
                    </button>
                </div>

                <div class="progress-bar-container">
                    <input type="range" id="progress-bar" value="0" min="0" max="100" step="0.01">
                    <div class="time-labels">
                        <span id="curr-time">0:00</span>
                        <span id="total-time">0:00</span>
                    </div>
                </div>
                <div class="main-controls">
                    <button class="ctrl-btn" onclick="toggleShuffle()"><span class="material-icons-round" id="shuffle-icon">shuffle</span></button>
                    <button class="ctrl-btn" onclick="prevSong()"><span class="material-icons-round" style="font-size: 36px;">skip_previous</span></button>
                    <button class="play-pause-btn" onclick="togglePlay()">
                        <span class="material-icons-round" id="player-play-icon">play_arrow</span>
                    </button>
                    <button class="ctrl-btn" onclick="nextSong()"><span class="material-icons-round" style="font-size: 36px;">skip_next</span></button>
                    <button class="ctrl-btn" onclick="toggleRepeat()"><span class="material-icons-round" id="repeat-icon">repeat</span></button>
                </div>
            </div>
        </div>

        <div id="eq-modal" class="modal-overlay" onclick="closeModals(event)">
            <div class="modal-box">
                <div class="modal-title">等化器 (EQ)</div>
                <div class="eq-sliders">
                    <div class="eq-band"><input type="range" class="eq-range" min="-12" max="12" value="0" data-freq="60" oninput="updateEQ(this)"><div class="eq-label">60</div></div>
                    <div class="eq-band"><input type="range" class="eq-range" min="-12" max="12" value="0" data-freq="250" oninput="updateEQ(this)"><div class="eq-label">250</div></div>
                    <div class="eq-band"><input type="range" class="eq-range" min="-12" max="12" value="0" data-freq="1000" oninput="updateEQ(this)"><div class="eq-label">1k</div></div>
                    <div class="eq-band"><input type="range" class="eq-range" min="-12" max="12" value="0" data-freq="4000" oninput="updateEQ(this)"><div class="eq-label">4k</div></div>
                    <div class="eq-band"><input type="range" class="eq-range" min="-12" max="12" value="0" data-freq="16000" oninput="updateEQ(this)"><div class="eq-label">16k</div></div>
                </div>
                <button class="eq-reset" onclick="resetEQ()">重置</button>
            </div>
        </div>

        <div id="timer-modal" class="modal-overlay" onclick="closeModals(event)">
            <div class="modal-box">
                <div class="modal-title">睡眠定時器</div>
                <div class="timer-options">
                    <button class="timer-btn" onclick="setTimer(15)">15 分鐘</button>
                    <button class="timer-btn" onclick="setTimer(30)">30 分鐘</button>
                    <button class="timer-btn" onclick="setTimer(60)">60 分鐘</button>
                    <button class="timer-btn" onclick="setTimer(0)">關閉定時</button>
                </div>
                <div id="timer-display"></div>
            </div>
        </div>

    </div>

    <audio id="audio-element" crossorigin="anonymous" preload="auto"></audio>

    <script>
        const USER = 'zihuanfeng520';
        const REPO = 'music-player';

        const audio = document.getElementById('audio-element');
        const pipCanvas = document.getElementById('pip-canvas'); 
        const pipVideo = document.getElementById('pip-video');    
        
        let allSongs = [];
        let currentPlaylist = [];
        let currentIndex = 0;
        let isShuffle = false;
        let loopMode = 0;
        let favorites = JSON.parse(localStorage.getItem('myFavorites')) || [];
        let currentTab = 'all';
        let playedHistory = [];
        let isDragging = false; 
        let rafId = null;
        let searchTerm = "";

        // ★★★ 節省流量模式變數 ★★★
        let isDataSaver = localStorage.getItem('dataSaver') === 'true';

        // PiP 動畫相關
        let pipImage = null; 
        let pipAngle = 0;    
        let pipIntervalId = null; 

        // Canvas 跑馬燈相關變數
        let pipTitleScroll = 0;
        let pipArtistScroll = 0;

        const songListContainer = document.getElementById('song-list-container');
        const vinylRecord = document.getElementById('vinyl-record');
        const toneArm = document.getElementById('tone-arm');
        const playerBg = document.getElementById('player-bg');
        const progressBar = document.getElementById('progress-bar');

        let contextMenuTargetIndex = -1;
        let audioCtx; let sourceNode; let filters = []; const frequencies = [60, 250, 1000, 4000, 16000];
        let timerInterval; let timerTargetTime = null;
        
        window.onload = async () => {
            // 初始化開關狀態顯示
            updateDataSaverUI();

            // 確保 PiP 畫布有預設內容
            updatePiP({title: "歡迎使用", artist: "請播放歌曲", cover: ""});
            
            startClock(); 
            await fetchFiles();
            switchTab('all');
            document.getElementById('loading-screen').style.opacity = '0';
            setTimeout(() => document.getElementById('loading-screen').style.display = 'none', 500);

            if ('mediaSession' in navigator) {
                navigator.mediaSession.setActionHandler('seekto', (details) => {
                    if (details.seekTime !== undefined) {
                        audio.currentTime = details.seekTime;
                        updatePositionState();
                    }
                });
                navigator.mediaSession.setActionHandler('play', () => togglePlay());
                navigator.mediaSession.setActionHandler('pause', () => togglePlay());
                navigator.mediaSession.setActionHandler('previoustrack', () => prevSong());
                navigator.mediaSession.setActionHandler('nexttrack', () => nextSong());
            }
            
            // 監聽 PiP 影片的播放/暫停事件，並強制同步到 Audio
            pipVideo.addEventListener('play', () => {
                if(audio.paused) { 
                    audio.play().catch(e => console.log("PiP Resume Sync Error:", e)); 
                    setPlayingState(true);
                }
            });

            pipVideo.addEventListener('pause', () => {
                if(!audio.paused) { 
                    audio.pause(); 
                    setPlayingState(false);
                }
            });

            pipVideo.addEventListener('leavepictureinpicture', () => {
                stopPiPLoop(); 
            });
            
            // ★★★ 自動重試機制 ★★★
            // 如果網路錯誤導致播放停止，嘗試自動下一首
            audio.addEventListener('error', (e) => {
                console.log("Audio Error, trying next song...", e);
                setTimeout(() => nextSong(true), 1000);
            });
        };

        function toggleDataSaver() {
            isDataSaver = !isDataSaver;
            localStorage.setItem('dataSaver', isDataSaver);
            updateDataSaverUI();
            
            if(confirm("切換流量模式需要重新整理頁面，是否立即重整？")) {
                location.reload();
            }
        }

        function updateDataSaverUI() {
            const statusSpan = document.getElementById('data-saver-status');
            if (isDataSaver) {
                statusSpan.innerText = 'ON';
                statusSpan.className = 'status-text status-on';
            } else {
                statusSpan.innerText = 'OFF';
                statusSpan.className = 'status-text status-off';
            }
        }

        function updatePositionState() {
            if ('mediaSession' in navigator && !isNaN(audio.duration)) {
                try {
                    navigator.mediaSession.setPositionState({
                        duration: audio.duration,
                        playbackRate: audio.playbackRate,
                        position: audio.currentTime
                    });
                } catch (e) {}
            }
        }

        async function togglePiP() {
            if (document.pictureInPictureElement) {
                await document.exitPictureInPicture();
            } else {
                try {
                    if (pipVideo.srcObject === null) {
                        // 使用 30 FPS 串流，省電防止被殺
                        pipVideo.srcObject = pipCanvas.captureStream(30);
                    }
                    
                    pipVideo.muted = false; 
                    
                    // 如果音樂正在播，打開 PiP 時影片也要播
                    if(!audio.paused) await pipVideo.play();
                    else pipVideo.pause();

                    if (pipVideo.readyState === 0) {
                        pipVideo.onloadedmetadata = async () => {
                            await pipVideo.requestPictureInPicture();
                        };
                    } else {
                        await pipVideo.requestPictureInPicture();
                    }
                    
                    if(!audio.paused) startPiPLoop();

                } catch (err) {
                    console.error("PiP Error:", err);
                    alert("子母畫面啟動失敗：\n" + err.message + "\n(請確認瀏覽器支援或已授予權限)");
                }
            }
        }

        function updatePiP(song) {
            pipTitleScroll = 0;
            pipArtistScroll = 0;

            pipCanvas.dataset.title = song.title || "未知歌曲";
            pipCanvas.dataset.artist = song.artist || "未知歌手";

            if (song.cover) {
                const img = new Image();
                img.crossOrigin = "Anonymous";
                img.src = song.cover;
                img.onload = () => {
                    pipImage = img; 
                    if (audio.paused) renderPiPFrame();
                };
                img.onerror = () => {
                    pipImage = null; 
                    if (audio.paused) renderPiPFrame();
                };
            } else {
                pipImage = null;
                if (audio.paused) renderPiPFrame();
            }
        }

        // 動畫迴圈 (30 FPS)
        function startPiPLoop() {
            if (pipIntervalId) clearInterval(pipIntervalId);
            pipIntervalId = setInterval(() => {
                pipAngle += 0.5; 
                pipTitleScroll += 1; 
                pipArtistScroll += 1;
                renderPiPFrame(); 
            }, 33);
        }

        function stopPiPLoop() {
            if (pipIntervalId) clearInterval(pipIntervalId);
        }

        // 繪製單幀 (含黑膠 & 跑馬燈 & 進度條)
        function renderPiPFrame() {
            const ctx = pipCanvas.getContext('2d');
            const width = pipCanvas.width;
            const height = pipCanvas.height;
            const cx = width / 2;
            const cy = height / 2 - 20; 

            // 強制重置座標系
            ctx.setTransform(1, 0, 0, 1, 0, 0); 
            ctx.fillStyle = '#121212';
            ctx.fillRect(0, 0, width, height);

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(pipAngle * Math.PI / 180); 

            // 黑膠底座
            const recordRadius = 150;
            ctx.beginPath();
            ctx.arc(0, 0, recordRadius, 0, Math.PI * 2);
            ctx.fillStyle = '#181818'; 
            ctx.fill();

            // 繪製溝槽
            ctx.strokeStyle = '#282828'; 
            ctx.lineWidth = 1;
            for (let r = 100; r < 145; r += 3) {
                ctx.beginPath();
                ctx.arc(0, 0, r, 0, Math.PI * 2);
                ctx.stroke();
            }

            // 繪製專輯封面 (圓形裁切)
            const labelRadius = 95; 
            if (pipImage) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(0, 0, labelRadius, 0, Math.PI * 2); 
                ctx.clip(); 

                const size = Math.min(pipImage.width, pipImage.height);
                const sx = (pipImage.width - size) / 2;
                const sy = (pipImage.height - size) / 2;

                ctx.drawImage(pipImage, sx, sy, size, size, -labelRadius, -labelRadius, labelRadius * 2, labelRadius * 2);
                ctx.restore();
            } else {
                ctx.beginPath();
                ctx.arc(0, 0, labelRadius, 0, Math.PI * 2); 
                ctx.fillStyle = '#333';
                ctx.fill();
            }

            // 繪製中心孔
            ctx.beginPath();
            ctx.arc(0, 0, 15, 0, Math.PI * 2); 
            ctx.fillStyle = '#121212'; 
            ctx.fill();

            ctx.restore(); 

            // 繪製跑馬燈文字
            const textAreaWidth = 380; 
            const titleY = height - 80;
            const artistY = height - 40;

            ctx.font = 'bold 28px Arial';
            const titleText = pipCanvas.dataset.title || "";
            const titleWidth = ctx.measureText(titleText).width;
            
            ctx.fillStyle = '#ffffff';
            if (titleWidth > textAreaWidth) {
                ctx.save();
                ctx.beginPath();
                ctx.rect((width - textAreaWidth)/2, titleY - 30, textAreaWidth, 40);
                ctx.clip();
                
                const totalDist = titleWidth + textAreaWidth + 50;
                const pos = pipTitleScroll % totalDist;
                const currentX = (width + textAreaWidth) / 2 - pos;
                
                ctx.textAlign = 'left';
                ctx.fillText(titleText, currentX, titleY);
                ctx.restore();
            } else {
                ctx.textAlign = 'center';
                ctx.fillText(titleText, width / 2, titleY);
            }
            
            ctx.font = '20px Arial';
            const artistText = pipCanvas.dataset.artist || "";
            const artistWidth = ctx.measureText(artistText).width;
            
            ctx.fillStyle = '#b3b3b3';
            if (artistWidth > textAreaWidth) {
                ctx.save();
                ctx.beginPath();
                ctx.rect((width - textAreaWidth)/2, artistY - 25, textAreaWidth, 30);
                ctx.clip();
                
                const totalDist = artistWidth + textAreaWidth + 50;
                const pos = pipArtistScroll % totalDist;
                const currentX = (width + textAreaWidth) / 2 - pos;
                
                ctx.textAlign = 'left';
                ctx.fillText(artistText, currentX, artistY);
                ctx.restore();
            } else {
                ctx.textAlign = 'center';
                ctx.fillText(artistText, width / 2, artistY);
            }

            // 畫上「視覺」進度條
            if (audio.duration) {
                const progress = audio.currentTime / audio.duration;
                const barHeight = 6;
                const barY = height - barHeight;
                ctx.fillStyle = '#333';
                ctx.fillRect(0, barY, width, barHeight);
                ctx.fillStyle = '#ffb703'; 
                ctx.fillRect(0, barY, width * progress, barHeight);
            }
        }

        function startClock() {
            function update() {
                const now = new Date();
                let hours = now.getHours();
                const minutes = String(now.getMinutes()).padStart(2, '0');
                
                let period = "";
                if (hours >= 0 && hours < 6) period = "凌晨";
                else if (hours >= 6 && hours < 12) period = "上午";
                else if (hours === 12) period = "中午";
                else if (hours >= 13 && hours < 18) period = "下午";
                else period = "晚上";

                hours = hours % 12;
                hours = hours ? hours : 12; 
                hours = String(hours).padStart(2, '0'); 

                document.getElementById('header-clock').innerText = `${period} ${hours}:${minutes}`;
            }
            update();
            setInterval(update, 1000);
        }

        async function fetchFiles() {
            const musicApi = `https://api.github.com/repos/${USER}/${REPO}/contents/music`;
            const picApi = `https://api.github.com/repos/${USER}/${REPO}/contents/picture`;

            try {
                let picData = [];
                let musicData = [];

                if (isDataSaver) {
                    const musicRes = await fetch(musicApi);
                    musicData = await musicRes.json();
                } else {
                    const [musicRes, picRes] = await Promise.all([fetch(musicApi), fetch(picApi)]);
                    musicData = await musicRes.json();
                    picData = await picRes.json();
                }

                const picMap = {};
                picData.forEach(p => picMap[p.name.split('.')[0].toLowerCase()] = p.download_url);
                const defaultPic = picMap['default'] || ''; 

                allSongs = musicData
                    .filter(file => file.name.match(/\.(mp3|wav|ogg|m4a|flac)$/i))
                    .map((file, index) => {
                        const baseName = file.name.replace(/\.[^/.]+$/, ""); 
                        const lowerName = baseName.toLowerCase();
                        let title = baseName;
                        let artist = "Unknown Artist";
                        
                        const specificPic = picMap[lowerName];
                        const cover = specificPic || defaultPic;
                        const isDefault = !specificPic;

                        return {
                            id: index, title: title, artist: artist, filename: baseName, 
                            url: file.download_url.replace(/#/g, '%23'),
                            cover: cover,
                            isDefault: isDefault, 
                            album: "" 
                        };
                    });

            } catch (e) {
                document.getElementById('loading-text').innerText = "讀取失敗";
                console.error(e);
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab-all').classList.remove('active');
            document.getElementById('tab-fav').classList.remove('active');
            document.getElementById(`tab-${tab}`).classList.add('active');

            if (tab === 'all') {
                currentPlaylist = [...allSongs];
            } else {
                currentPlaylist = allSongs.filter(song => favorites.includes(song.filename));
            }
            
            searchTerm = "";
            document.querySelector('.search-input').value = "";

            playedHistory = [];
            renderList();
            if (currentPlaylist.length > 0 && !audio.src) {
                loadSong(0, false);
            }
        }

        function filterSongs(val) {
            searchTerm = val.toLowerCase();
            renderList();
        }

        function renderList() {
            songListContainer.innerHTML = '';
            
            let displayCount = 0;

            currentPlaylist.forEach((song, idx) => {
                if (searchTerm) {
                    const text = (song.title + song.artist + (song.album || "")).toLowerCase();
                    if (!text.includes(searchTerm)) return;
                }
                
                displayCount++;

                const isFav = favorites.includes(song.filename);
                const div = document.createElement('div');
                div.className = 'song-item';
                
                let infoText = song.artist;
                if (song.album) infoText += ` - ${song.album}`;

                const imgTag = song.cover ? `<img src="${song.cover}" class="song-cover-thumb" id="list-cover-${song.id}">` : `<div class="song-cover-thumb" style="background:#333; display:flex; align-items:center; justify-content:center;"><span class="material-icons-round">music_note</span></div>`;

                div.innerHTML = `
                    ${imgTag}
                    <div class="song-info-list">
                        <div class="song-title-list" id="list-title-${song.id}" style="color: ${idx === currentIndex ? 'var(--primary-color)' : 'white'}">${song.title}</div>
                        <div class="song-artist-list" id="list-info-${song.id}">${infoText}</div>
                    </div>
                    <div class="song-actions">
                        ${isFav ? '<span class="material-icons-round fav-icon active">favorite</span>' : ''}
                        <span class="material-icons-round" style="color:#aaa; margin-left:10px; padding:10px; cursor: pointer;" onclick="showContextMenu(event, ${idx})">more_vert</span>
                    </div>
                `;
                div.onclick = (e) => {
                    if(e.target.innerText === 'more_vert') return;
                    currentIndex = idx;
                    playSong();
                };
                songListContainer.appendChild(div);
                
                setTextAnimation(`list-title-${song.id}`, song.title);
            });

            if (displayCount === 0) {
                songListContainer.innerHTML = `<div class="empty-tips">沒有找到符合的歌曲</div>`;
            }
        }

        function toggleVolumePopup() {
            const popup = document.getElementById('volume-popup');
            popup.classList.toggle('show');
            if (popup.classList.contains('show')) {
                setTimeout(() => { document.addEventListener('click', closeVolumeOnClickOutside); }, 0);
            }
        }
        function closeVolumeOnClickOutside(e) {
            const popup = document.getElementById('volume-popup');
            const btn = e.target.closest('.volume-container');
            if (!popup.contains(e.target) && !btn) {
                popup.classList.remove('show');
                document.removeEventListener('click', closeVolumeOnClickOutside);
            }
        }
        function setVolume(val) { audio.volume = val; }

        function showContextMenu(e, index) {
            e.stopPropagation(); contextMenuTargetIndex = index;
            const menu = document.getElementById('context-menu');
            const overlay = document.getElementById('context-overlay');
            const song = currentPlaylist[index];
            const isFav = favorites.includes(song.filename);
            const favIcon = document.getElementById('ctx-fav-icon');
            const favText = document.getElementById('ctx-fav-text');
            const favBtn = document.getElementById('ctx-fav-btn');

            if (isFav) {
                favIcon.innerText = 'favorite'; favText.innerText = '取消最愛'; favBtn.style.color = '#ff4757';
            } else {
                favIcon.innerText = 'favorite_border'; favText.innerText = '加入最愛'; favBtn.style.color = 'white';
            }
            const rect = e.target.getBoundingClientRect();
            menu.style.top = rect.bottom + 'px'; menu.style.right = (window.innerWidth - rect.right) + 'px'; 
            menu.style.display = 'block'; overlay.style.display = 'block';
        }

        function hideContextMenu() {
            document.getElementById('context-menu').style.display = 'none';
            document.getElementById('context-overlay').style.display = 'none';
        }
        
        function fnToggleFavList() {
            hideContextMenu(); if(contextMenuTargetIndex === -1) return;
            const song = currentPlaylist[contextMenuTargetIndex];
            const idx = favorites.indexOf(song.filename);
            if (idx > -1) favorites.splice(idx, 1); else favorites.push(song.filename);
            localStorage.setItem('myFavorites', JSON.stringify(favorites));
            if (currentTab === 'fav') {
                if (idx > -1) { 
                    currentPlaylist.splice(contextMenuTargetIndex, 1);
                    if (contextMenuTargetIndex < currentIndex) currentIndex--;
                }
                renderList();
            } else { renderList(); }
            if (currentPlaylist[currentIndex] && song.filename === currentPlaylist[currentIndex].filename) {
                updateUI(currentPlaylist[currentIndex]);
            } else if (currentPlaylist.length > 0 && currentTab === 'fav' && contextMenuTargetIndex === currentIndex) {
                 if(currentPlaylist[currentIndex]) updateUI(currentPlaylist[currentIndex]);
            }
        }

        function fnPlayNext() {
            hideContextMenu(); if(contextMenuTargetIndex === -1 || contextMenuTargetIndex === currentIndex) return;
            const song = currentPlaylist[contextMenuTargetIndex];
            currentPlaylist.splice(contextMenuTargetIndex, 1);
            if(contextMenuTargetIndex < currentIndex) currentIndex--;
            currentPlaylist.splice(currentIndex + 1, 0, song);
            renderList(); 
        }
        function fnDownload() {
            hideContextMenu(); if(contextMenuTargetIndex === -1) return;
            const song = currentPlaylist[contextMenuTargetIndex];
            const link = document.createElement('a');
            link.href = song.url; link.target = '_blank'; link.download = song.filename;
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }
        function fnRemove() {
            hideContextMenu(); if(contextMenuTargetIndex === -1) return;
            if(contextMenuTargetIndex === currentIndex) nextSong();
            const song = currentPlaylist[contextMenuTargetIndex];
            currentPlaylist.splice(contextMenuTargetIndex, 1);
            if(contextMenuTargetIndex < currentIndex) currentIndex--;
            if (currentTab === 'fav') {
                const favIdx = favorites.indexOf(song.filename);
                if (favIdx > -1) { favorites.splice(favIdx, 1); localStorage.setItem('myFavorites', JSON.stringify(favorites)); }
            }
            renderList();
        }

        function loadSong(index, autoPlay = true) {
            if (index < 0 || index >= currentPlaylist.length) return;
            const song = currentPlaylist[index];
            audio.src = song.url;
            audio.load(); // ★★★ 修正：強制重置緩衝區 ★★★

            document.getElementById('player-album').innerText = ""; 

            initAudioContext();
            
            // ★★★ 修正：如果網頁在背景（不可見），就跳過 ID3 讀取，避免網路塞車導致無法播放 ★★★
            if (!isDataSaver && document.visibilityState === 'visible') {
                readID3Tags(song);
            }
            
            updateUI(song);
            
            if (isShuffle && loopMode === 0) {
                if(!playedHistory.includes(index)) playedHistory.push(index);
            }

            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: song.title,
                    artist: song.artist,
                    artwork: song.cover ? [{ src: song.cover, sizes: '512x512', type: 'image/jpeg' }] : []
                });
            }

            if (autoPlay) {
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                
                // ★★★ 修正：更穩定的播放呼叫 ★★★
                const playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise
                        .then(() => {
                            setPlayingState(true);
                        })
                        .catch(e => {
                            console.log("播放阻擋或失敗", e);
                            setPlayingState(false);
                        });
                }
            } else {
                setPlayingState(false);
            }
            renderList();
        }

        function setTextAnimation(elementId, text) {
            const container = document.getElementById(elementId);
            if (!container) return;
            container.innerHTML = `<span class="scroll-text">${text}</span>`;
            const span = container.querySelector('.scroll-text');
            if (span.scrollWidth > container.clientWidth) {
                span.classList.add('scrolling');
            } else {
                span.classList.remove('scrolling');
            }
        }

        function initAudioContext() {
            if (audioCtx) return; 
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            sourceNode = audioCtx.createMediaElementSource(audio);
            let prevNode = sourceNode;
            frequencies.forEach(freq => {
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'peaking'; filter.frequency.value = freq;
                filter.Q.value = 1; filter.gain.value = 0; 
                prevNode.connect(filter); prevNode = filter; filters.push(filter);
            });
            prevNode.connect(audioCtx.destination);
        }

        function openEQ() { document.getElementById('eq-modal').style.display = 'flex'; }
        function updateEQ(input) {
            const freq = parseInt(input.dataset.freq); const gain = parseInt(input.value);
            const index = frequencies.indexOf(freq); if (filters[index]) filters[index].gain.value = gain;
        }
        function resetEQ() {
            const inputs = document.querySelectorAll('.eq-range');
            inputs.forEach(input => { input.value = 0; updateEQ(input); });
        }

        function openTimer() { document.getElementById('timer-modal').style.display = 'flex'; updateTimerUI(); }
        function setTimer(minutes) {
            clearInterval(timerInterval);
            document.getElementById('btn-timer').classList.remove('active');
            if (minutes === 0) {
                timerTargetTime = null; document.getElementById('timer-display').innerText = "定時已關閉"; return;
            }
            const now = new Date().getTime(); timerTargetTime = now + minutes * 60 * 1000;
            document.getElementById('btn-timer').classList.add('active'); updateTimerUI();
            timerInterval = setInterval(() => {
                const now = new Date().getTime(); const distance = timerTargetTime - now;
                if (distance < 0) {
                    clearInterval(timerInterval); audio.pause(); setPlayingState(false);
                    timerTargetTime = null; document.getElementById('btn-timer').classList.remove('active');
                    alert("定時結束，音樂暫停");
                } else { if(document.getElementById('timer-modal').style.display === 'flex') updateTimerUI(); }
            }, 1000);
        }
        function updateTimerUI() {
            if (!timerTargetTime) { document.getElementById('timer-display').innerText = ""; return; }
            const now = new Date().getTime(); const distance = timerTargetTime - now;
            const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((distance % (1000 * 60)) / 1000);
            document.getElementById('timer-display').innerText = `剩餘時間: ${m}分 ${s}秒`;
        }

        function closeModals(e) { if (e.target.classList.contains('modal-overlay')) e.target.style.display = 'none'; }

        async function readID3Tags(song) {
            try {
                const controller = new AbortController(); const signal = controller.signal;
                const response = await fetch(song.url, { signal }); if (!response.ok) return;
                const reader = response.body.getReader(); let chunks = []; let receivedLength = 0; 
                
                const LIMIT = 5 * 1024 * 1024; 
                
                while (true) {
                    const { done, value } = await reader.read(); if (done) break;
                    chunks.push(value); receivedLength += value.length;
                    if (receivedLength > LIMIT) { controller.abort(); break; }
                }
                const blob = new Blob(chunks);
                
                new jsmediatags.Reader(blob).setTagsToRead(["title", "artist", "album", "picture"]).read({
                    onSuccess: function(tag) {
                        const tags = tag.tags;
                        if (tags.title) {
                            setTextAnimation('player-title', tags.title);
                            setTextAnimation('mini-title', tags.title);
                            
                            const listTitle = document.getElementById(`list-title-${song.id}`);
                            if (listTitle) setTextAnimation(`list-title-${song.id}`, tags.title);

                            if ('mediaSession' in navigator) navigator.mediaSession.metadata.title = tags.title;
                        }
                        if (tags.artist) {
                            document.getElementById('player-artist').innerText = tags.artist;
                            document.getElementById('mini-artist').innerText = tags.artist;
                            song.artist = tags.artist; 
                            if ('mediaSession' in navigator) navigator.mediaSession.metadata.artist = tags.artist;
                        }
                        if (tags.album) {
                            document.getElementById('player-album').innerText = tags.album;
                            song.album = tags.album;
                        }
                        
                        const listInfo = document.getElementById(`list-info-${song.id}`);
                        if (listInfo) {
                            let infoText = song.artist;
                            if (song.album) infoText += ` - ${song.album}`;
                            listInfo.innerText = infoText;
                        }

                        if (song.isDefault && tags.picture) {
                            const data = tags.picture.data;
                            const format = tags.picture.format;
                            let base64String = "";
                            for (let i = 0; i < data.length; i++) {
                                base64String += String.fromCharCode(data[i]);
                            }
                            const url = "data:" + format + ";base64," + window.btoa(base64String);
                            
                            song.cover = url;
                            song.isDefault = false;

                            document.getElementById('player-cover').style.backgroundImage = `url('${url}')`;
                            document.getElementById('mini-cover').src = url;
                            document.getElementById('player-bg').style.backgroundImage = `url('${url}')`;
                            
                            const listImg = document.getElementById(`list-cover-${song.id}`);
                            if (listImg) {
                                listImg.src = url;
                            }

                            if ('mediaSession' in navigator) {
                                navigator.mediaSession.metadata.artwork = [{ src: url, sizes: '512x512', type: format }];
                            }
                        }
                        
                        updatePiP(song); // 更新 PiP

                    }, onError: function(error) {}
                });
            } catch (err) {}
        }

        function updateUI(song) {
            setTextAnimation('mini-title', song.title);
            setTextAnimation('player-title', song.title);
            
            document.getElementById('mini-artist').innerText = song.artist;
            
            if(song.cover) {
                document.getElementById('mini-cover').src = song.cover;
                document.getElementById('player-cover').style.backgroundImage = `url('${song.cover}')`;
                playerBg.style.backgroundImage = `url('${song.cover}')`;
            } else {
                document.getElementById('mini-cover').src = ''; 
                document.getElementById('player-cover').style.backgroundImage = 'none';
                document.getElementById('player-cover').style.backgroundColor = '#333';
                playerBg.style.backgroundImage = 'none';
            }
            
            document.getElementById('player-artist').innerText = song.artist;
            document.getElementById('player-album').innerText = song.album || "";

            const favBtn = document.getElementById('player-fav-btn');
            if(favorites.includes(song.filename)) {
                favBtn.classList.add('active'); favBtn.innerHTML = '<span class="material-icons-round">favorite</span>';
            } else {
                favBtn.classList.remove('active'); favBtn.innerHTML = '<span class="material-icons-round">favorite_border</span>';
            }
            
            updatePiP(song); // 更新 PiP
        }

        function playSong() { loadSong(currentIndex, true); }
        function togglePlay() {
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            if (audio.paused) { 
                audio.play().catch(e => console.log("Play failed:", e)); 
                setPlayingState(true); 
                if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
                if (pipVideo.srcObject && pipVideo.paused) pipVideo.play();
            } 
            else { 
                audio.pause(); 
                setPlayingState(false); 
                if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
                if (!pipVideo.paused) pipVideo.pause(); 
                stopPiPLoop(); 
            }
        }

        function setPlayingState(isPlaying) {
            const icons = ['mini-play-icon', 'player-play-icon'];
            icons.forEach(id => document.getElementById(id).innerText = isPlaying ? 'pause' : 'play_arrow');
            if (isPlaying) { 
                vinylRecord.classList.add('playing'); toneArm.classList.add('playing'); 
                if (rafId) cancelAnimationFrame(rafId); updateProgressLoop();
                startPiPLoop(); // 開始 PiP 旋轉
            } else { 
                vinylRecord.classList.remove('playing'); toneArm.classList.remove('playing'); 
                document.getElementById('tone-arm').style.transform = '';
                if (rafId) cancelAnimationFrame(rafId);
            }
        }

        function updateProgressLoop() {
            if (!audio.paused && !isDragging) {
                const percent = (audio.currentTime / audio.duration) * 100;
                const safePercent = isNaN(percent) ? 0 : percent;
                progressBar.value = safePercent;
                
                const armPercent = (audio.currentTime / audio.duration) || 0;
                const angle = 9 + (13 * armPercent);
                document.getElementById('tone-arm').style.transform = `rotate(${angle}deg)`;

                rafId = requestAnimationFrame(updateProgressLoop);
            }
        }

        function nextSong(isAuto = false) {
            const len = currentPlaylist.length;
            if (len === 0) return;
            if (isAuto && loopMode === 2) { audio.currentTime = 0; audio.play(); return; }
            if (isShuffle) {
                if (loopMode === 1 || loopMode === 2) {
                    let nextIndex = Math.floor(Math.random() * len);
                    if (len > 1 && nextIndex === currentIndex) nextIndex = (currentIndex + 1) % len;
                    currentIndex = nextIndex; playSong();
                } else {
                    const unplayed = [];
                    for(let i=0; i<len; i++) if(!playedHistory.includes(i)) unplayed.push(i);
                    if (unplayed.length === 0) {
                        if (isAuto) { audio.pause(); audio.currentTime = 0; setPlayingState(false); playedHistory = []; } 
                        else { playedHistory = []; currentIndex = Math.floor(Math.random() * len); playSong(); }
                    } else {
                        const randomIdx = Math.floor(Math.random() * unplayed.length);
                        currentIndex = unplayed[randomIdx]; playSong();
                    }
                }
            } else {
                if (currentIndex >= len - 1) {
                    if (loopMode === 1 || loopMode === 2) { currentIndex = 0; playSong(); } 
                    else { if (isAuto) { audio.pause(); audio.currentTime = 0; setPlayingState(false); } else { currentIndex = 0; playSong(); } }
                } else { currentIndex++; playSong(); }
            }
        }

        function prevSong() {
            currentIndex = (currentIndex - 1 + currentPlaylist.length) % currentPlaylist.length;
            playSong();
        }
        
        function playRandom() {
            isShuffle = true; loopMode = 0; updateLoopIcon(); 
            document.getElementById('shuffle-icon').style.color = 'var(--primary-color)';
            playedHistory = []; currentIndex = Math.floor(Math.random() * currentPlaylist.length);
            playSong(); openPlayer();
        }

        audio.ontimeupdate = () => {
            document.getElementById('curr-time').innerText = formatTime(audio.currentTime);
            document.getElementById('total-time').innerText = formatTime(audio.duration || 0);
            updatePositionState(); // 同步系統通知列進度
        };
        
        audio.onended = () => { if (loopMode === 2) { audio.currentTime = 0; audio.play(); } else { nextSong(true); } };

        progressBar.addEventListener('mousedown', () => { isDragging = true; });
        progressBar.addEventListener('touchstart', () => { isDragging = true; });
        progressBar.addEventListener('input', (e) => {
            const time = (e.target.value / 100) * audio.duration;
            audio.currentTime = time;
            document.getElementById('curr-time').innerText = formatTime(time);
            
            const percent = e.target.value / 100;
            const angle = 9 + (13 * percent);
            document.getElementById('tone-arm').style.transform = `rotate(${angle}deg)`;
        });
        progressBar.addEventListener('mouseup', () => { isDragging = false; updateProgressLoop(); });
        progressBar.addEventListener('touchend', () => { isDragging = false; updateProgressLoop(); });

        function formatTime(s) {
            const min = Math.floor(s / 60); const sec = Math.floor(s % 60);
            return `${min}:${sec < 10 ? '0'+sec : sec}`;
        }
        function openPlayer() { document.getElementById('player-view').classList.add('active'); }
        function closePlayer() { document.getElementById('player-view').classList.remove('active'); }
        function toggleMenu() {
            const menu = document.getElementById('menu-options'); menu.classList.toggle('show');
            document.addEventListener('click', function close(e) {
                if(!e.target.closest('.nav-bar')) { menu.classList.remove('show'); document.removeEventListener('click', close); }
            });
        }
        function toggleFavorite() {
            const song = currentPlaylist[currentIndex]; const idx = favorites.indexOf(song.filename);
            if (idx > -1) { favorites.splice(idx, 1); } else { favorites.push(song.filename); }
            localStorage.setItem('myFavorites', JSON.stringify(favorites));
            if (currentTab === 'fav' && idx > -1) {
                currentPlaylist.splice(currentIndex, 1);
                if(currentIndex >= currentPlaylist.length) currentIndex = 0;
                renderList();
                if(currentPlaylist.length === 0) { audio.pause(); setPlayingState(false); } 
                else { updateUI(currentPlaylist[currentIndex]); }
            } else { updateUI(song); renderList(); }
        }
        function exportFavorites() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(favorites));
            const link = document.createElement('a'); link.href = dataStr; link.download = "my_fav_songs.json";
            document.body.appendChild(link); link.click(); link.remove();
        }
        function importFavorites(input) {
            const file = input.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        favorites = imported; localStorage.setItem('myFavorites', JSON.stringify(favorites));
                        alert("導入成功！"); if(currentTab === 'fav') switchTab('fav'); else renderList();
                        if(currentPlaylist[currentIndex]) updateUI(currentPlaylist[currentIndex]);
                    } else { alert("檔案格式錯誤"); }
                } catch (err) { alert("讀取失敗"); }
            };
            reader.readAsText(file);
        }
        
        function toggleShuffle() { 
            isShuffle = !isShuffle; 
            document.getElementById('shuffle-icon').style.color = isShuffle ? 'var(--primary-color)' : 'white';
            playedHistory = [];
        }
        
        function toggleRepeat() { 
            loopMode = (loopMode + 1) % 3;
            updateLoopIcon();
        }

        function updateLoopIcon() {
            const icon = document.getElementById('repeat-icon');
            switch(loopMode) {
                case 0: icon.innerText = 'repeat'; icon.style.color = 'white'; break;
                case 1: icon.innerText = 'repeat'; icon.style.color = 'var(--primary-color)'; break;
                case 2: icon.innerText = 'repeat_one'; icon.style.color = 'var(--primary-color)'; break;
            }
        }
    </script>
</body>
