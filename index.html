<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GitHub Music Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <style>
        /* --- 全局變數與重置 --- */
        :root {
            --primary-color: #ffb703;
            --bg-color: #121212;
            --text-main: #ffffff;
            --text-sub: #b3b3b3;
            --menu-bg: #333333;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
        }

        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.5s;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid #333;
            border-top: 4px solid var(--primary-color); border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #app-container { width: 100%; height: 100%; position: relative; }

        /* --- 1. 列表頁面 --- */
        #list-view {
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            background: linear-gradient(180deg, #1e1e2e 0%, #000000 100%);
            padding-bottom: 80px;
            position: absolute; top: 0; left: 0;
            z-index: 10;
        }

        .nav-bar {
            padding: 20px; display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(10px);
        }
        .nav-title { font-size: 20px; font-weight: 700; }
        .icon-btn { background: none; border: none; color: white; cursor: pointer; padding: 8px; }

        /* 頂部選單 (導入導出用) */
        .menu-options {
            position: absolute; top: 60px; right: 10px;
            background: #333; border-radius: 8px; padding: 10px;
            display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 100;
        }
        .menu-options.show { display: block; }
        .menu-item { padding: 10px 20px; color: white; cursor: pointer; font-size: 14px; }
        .menu-item:hover { background: #444; }

        .shuffle-header {
            padding: 10px 20px; display: flex; align-items: center; color: var(--primary-color);
            font-weight: bold; cursor: pointer;
        }
        .shuffle-header span { margin-left: 10px; }

        .song-list { flex: 1; overflow-y: auto; padding: 0 20px; }
        .song-item {
            display: flex; align-items: center; padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer;
            position: relative;
        }
        .song-cover-thumb { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; margin-right: 15px; }
        .song-info-list { flex: 1; min-width: 0; }
        /* 讓歌名完整顯示，過長才省略 */
        .song-title-list { font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-artist-list { font-size: 13px; color: var(--text-sub); margin-top: 4px; }
        
        .song-actions { display: flex; align-items: center; }
        .fav-icon { color: #666; margin-left: 10px; }
        .fav-icon.active { color: #ff4757; }

        /* ★★★ 浮動快顯選單 (Popup Menu) ★★★ */
        .context-menu {
            position: fixed;
            background-color: var(--menu-bg);
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            width: 160px;
            display: none;
            z-index: 999;
            overflow: hidden;
            animation: popIn 0.2s ease-out;
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .context-item {
            padding: 12px 15px;
            color: white;
            font-size: 14px;
            display: flex; align-items: center;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .context-item:last-child { border-bottom: none; }
        .context-item:hover { background-color: #444; }
        .context-item span.material-icons-round { margin-right: 10px; font-size: 18px; color: #ccc; }
        
        .context-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 998; display: none;
        }

        /* 迷你播放器 */
        .mini-player {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 70px;
            background: #222; border-top: 1px solid #333;
            display: flex; align-items: center; padding: 0 15px;
            cursor: pointer; z-index: 20;
        }
        .mini-info { flex: 1; margin: 0 15px; }
        .mini-title { font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mini-artist { font-size: 12px; color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mini-controls button { font-size: 32px; color: white; background: none; border: none; }

        /* --- 2. 播放器頁面 --- */
        #player-view {
            width: 100%; height: 100%;
            position: absolute; top: 0; left: 0;
            background: #000;
            display: flex; flex-direction: column;
            transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
            z-index: 50; overflow: hidden;
        }
        #player-view.active { transform: translateY(0); }

        #player-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            filter: blur(40px) brightness(0.4); z-index: -1;
            transition: background-image 0.5s ease;
        }

        .player-nav { padding: 20px; display: flex; justify-content: space-between; align-items: center; color: white; }

        .vinyl-area { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; }
        .tone-arm {
            position: absolute; top: 0; right: 40px; width: 80px; height: 120px;
            background: url('https://cdn-icons-png.flaticon.com/512/3067/3067403.png') no-repeat center/contain;
            transform-origin: 65px 15px; transform: rotate(-30deg);
            transition: transform 0.5s; z-index: 10; pointer-events: none;
            filter: invert(1); opacity: 0.8;
        }
        .tone-arm.playing { transform: rotate(0deg); }

        .vinyl-record {
            width: 280px; height: 280px;
            background: radial-gradient(#111 50%, #000 51%);
            border-radius: 50%;
            border: 8px solid rgba(255,255,255,0.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex; justify-content: center; align-items: center;
            animation: rotate 10s linear infinite;
            animation-play-state: paused;
            position: relative;
        }
        .vinyl-record.playing { animation-play-state: running; }
        .vinyl-record::before {
            content: ''; position: absolute; width: 95%; height: 95%;
            border-radius: 50%;
            background: repeating-radial-gradient(#111 0, #111 2px, #222 3px, #222 4px);
            z-index: 1;
        }

        .album-art {
            width: 180px; height: 180px; border-radius: 50%;
            background-size: cover; background-position: center;
            z-index: 2; position: relative;
            box-shadow: 0 0 0 5px #111;
        }
        @keyframes rotate { 100% { transform: rotate(360deg); } }

        .player-controls-area { padding: 30px; display: flex; flex-direction: column; }
        .player-info { text-align: center; margin-bottom: 20px; }
        .player-title { font-size: 24px; font-weight: bold; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-artist { font-size: 16px; color: #ccc; }
        
        .progress-bar-container { width: 100%; margin-bottom: 20px; }
        .time-labels { display: flex; justify-content: space-between; font-size: 12px; color: #ddd; margin-top: 5px;}
        
        input[type="range"] {
            width: 100%; height: 4px; background: rgba(255,255,255,0.3);
            border-radius: 2px; -webkit-appearance: none; outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 12px; height: 12px;
            background: #fff; border-radius: 50%; cursor: pointer;
        }

        .main-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .ctrl-btn { background: none; border: none; color: white; cursor: pointer; }
        .play-pause-btn {
            width: 70px; height: 70px; background: white; border-radius: 50%;
            color: black; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 5px 15px rgba(255,255,255,0.3);
        }
        .material-icons-round { font-size: 28px; }
        .play-pause-btn .material-icons-round { font-size: 40px; }

        #player-fav-btn.active { color: #ff4757; }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="spinner"></div>
        <div id="loading-text">正在讀取 GitHub 倉庫...</div>
    </div>

    <div id="app-container">
        
        <div id="list-view">
            <div class="nav-bar">
                <span class="material-icons-round" style="opacity:0">menu</span>
                <div class="nav-title">音樂播放器</div>
                <button class="icon-btn" onclick="toggleMenu()"><span class="material-icons-round">more_vert</span></button>
                
                <div class="menu-options" id="menu-options">
                    <div class="menu-item" onclick="exportFavorites()">導出最愛列表</div>
                    <label class="menu-item" style="display:block">
                        導入最愛列表
                        <input type="file" id="import-file" style="display:none" onchange="importFavorites(this)">
                    </label>
                </div>
            </div>

            <div class="shuffle-header" onclick="playRandom()">
                <span class="material-icons-round">shuffle</span>
                <span>隨機播放</span>
            </div>

            <div class="song-list" id="song-list-container"></div>

            <div class="mini-player" id="mini-player" onclick="openPlayer()">
                <img src="" class="song-cover-thumb" id="mini-cover">
                <div class="mini-info">
                    <div class="mini-title" id="mini-title">未播放</div>
                    <div class="mini-artist" id="mini-artist">請選擇歌曲</div>
                </div>
                <div class="mini-controls">
                    <button onclick="event.stopPropagation(); togglePlay()">
                        <span class="material-icons-round" id="mini-play-icon">play_arrow</span>
                    </button>
                </div>
            </div>

            <div id="context-overlay" class="context-overlay" onclick="hideContextMenu()"></div>
            <div id="context-menu" class="context-menu">
                <div class="context-item" onclick="fnPlayNext()">
                    <span class="material-icons-round">playlist_play</span> 下一首播放
                </div>
                <div class="context-item" onclick="fnDownload()">
                    <span class="material-icons-round">download</span> 下載
                </div>
                <div class="context-item" onclick="fnRemove()" style="color: #ff6b6b;">
                    <span class="material-icons-round" style="color: #ff6b6b;">delete</span> 移除
                </div>
            </div>

        </div>

        <div id="player-view">
            <div id="player-bg"></div>
            <div class="player-nav">
                <button class="icon-btn" onclick="closePlayer()"><span class="material-icons-round">keyboard_arrow_down</span></button>
                <span>正在播放</span>
                <button class="icon-btn"><span class="material-icons-round">queue_music</span></button>
            </div>
            <div class="vinyl-area">
                <div class="tone-arm" id="tone-arm"></div>
                <div class="vinyl-record" id="vinyl-record">
                    <div class="album-art" id="player-cover"></div>
                </div>
            </div>
            <div class="player-controls-area">
                <div class="player-info">
                    <div class="player-title" id="player-title">Song Title</div>
                    <div class="player-artist" id="player-artist">Unknown Artist</div>
                </div>
                <div class="main-controls" style="justify-content: space-around; margin-bottom: 20px;">
                    <button class="ctrl-btn" id="player-fav-btn" onclick="toggleFavorite()"><span class="material-icons-round">favorite_border</span></button>
                    <button class="ctrl-btn"><span class="material-icons-round">add</span></button>
                    <button class="ctrl-btn"><span class="material-icons-round">eq</span></button>
                    <button class="ctrl-btn"><span class="material-icons-round">timer</span></button>
                    <button class="ctrl-btn"><span class="material-icons-round">playlist_play</span></button>
                </div>
                <div class="progress-bar-container">
                    <input type="range" id="progress-bar" value="0" min="0" max="100">
                    <div class="time-labels">
                        <span id="curr-time">0:00</span>
                        <span id="total-time">0:00</span>
                    </div>
                </div>
                <div class="main-controls">
                    <button class="ctrl-btn" onclick="toggleShuffle()"><span class="material-icons-round" id="shuffle-icon">shuffle</span></button>
                    <button class="ctrl-btn" onclick="prevSong()"><span class="material-icons-round" style="font-size: 36px;">skip_previous</span></button>
                    <button class="play-pause-btn" onclick="togglePlay()">
                        <span class="material-icons-round" id="player-play-icon">play_arrow</span>
                    </button>
                    <button class="ctrl-btn" onclick="nextSong()"><span class="material-icons-round" style="font-size: 36px;">skip_next</span></button>
                    <button class="ctrl-btn" onclick="toggleRepeat()"><span class="material-icons-round" id="repeat-icon">repeat</span></button>
                </div>
            </div>
        </div>
    </div>

    <audio id="audio-element"></audio>

    <script>
        const USER = 'zihuanfeng520';
        const REPO = 'music-player';

        const audio = document.getElementById('audio-element');
        let allSongs = [];
        let currentPlaylist = [];
        let currentIndex = 0;
        let isShuffle = false;
        let isRepeat = false;
        let favorites = JSON.parse(localStorage.getItem('myFavorites')) || [];

        const songListContainer = document.getElementById('song-list-container');
        const vinylRecord = document.getElementById('vinyl-record');
        const toneArm = document.getElementById('tone-arm');
        const playerBg = document.getElementById('player-bg');

        let contextMenuTargetIndex = -1; 
        
        window.onload = async () => {
            await fetchFiles();
            renderList();
            document.getElementById('loading-screen').style.opacity = '0';
            setTimeout(() => document.getElementById('loading-screen').style.display = 'none', 500);
        };

        async function fetchFiles() {
            const musicApi = `https://api.github.com/repos/${USER}/${REPO}/contents/music`;
            const picApi = `https://api.github.com/repos/${USER}/${REPO}/contents/picture`;

            try {
                const [musicRes, picRes] = await Promise.all([fetch(musicApi), fetch(picApi)]);
                const musicData = await musicRes.json();
                const picData = await picRes.json();

                const picMap = {};
                picData.forEach(p => picMap[p.name.split('.')[0].toLowerCase()] = p.download_url);
                const defaultPic = picMap['default'] || ''; 

                allSongs = musicData
                    .filter(file => file.name.match(/\.(mp3|wav|ogg|m4a|flac)$/i))
                    .map((file, index) => {
                        const baseName = file.name.replace(/\.[^/.]+$/, ""); 
                        const lowerName = baseName.toLowerCase();
                        
                        // ★★★ 修改：完全依照你的指示 ★★★
                        // 1. 標題：完全保留原始檔名 (包含 - )
                        let title = baseName;
                        
                        // 2. 歌手：預設 Unknown，完全不猜測，只等讀取 ID3
                        let artist = "Unknown Artist";
                        
                        return {
                            id: index,
                            title: title, 
                            artist: artist, 
                            filename: baseName, 
                            url: file.download_url,
                            cover: picMap[lowerName] || defaultPic
                        };
                    });
                
                currentPlaylist = [...allSongs];
                
                if(allSongs.length > 0) {
                    loadSong(0, false); 
                }

            } catch (e) {
                document.getElementById('loading-text').innerText = "讀取失敗，請檢查網路或 GitHub 設定";
                console.error(e);
            }
        }

        function renderList() {
            songListContainer.innerHTML = '';
            currentPlaylist.forEach((song, idx) => {
                const isFav = favorites.includes(song.filename);
                const div = document.createElement('div');
                div.className = 'song-item';
                div.innerHTML = `
                    <img src="${song.cover}" class="song-cover-thumb">
                    <div class="song-info-list">
                        <div class="song-title-list" style="color: ${idx === currentIndex ? 'var(--primary-color)' : 'white'}">${song.title}</div>
                        <div class="song-artist-list">${song.artist}</div>
                    </div>
                    <div class="song-actions">
                        ${isFav ? '<span class="material-icons-round fav-icon active">favorite</span>' : ''}
                        <span class="material-icons-round" 
                              style="color:#aaa; margin-left:10px; padding:10px; cursor: pointer;"
                              onclick="showContextMenu(event, ${idx})">
                            more_vert
                        </span>
                    </div>
                `;
                div.onclick = (e) => {
                    if(e.target.innerText === 'more_vert') return;
                    currentIndex = idx;
                    playSong();
                };
                songListContainer.appendChild(div);
            });
        }

        // ★★★ 選單功能 ★★★
        function showContextMenu(e, index) {
            e.stopPropagation(); 
            contextMenuTargetIndex = index;

            const menu = document.getElementById('context-menu');
            const overlay = document.getElementById('context-overlay');
            
            const rect = e.target.getBoundingClientRect();
            let top = rect.bottom;
            let right = window.innerWidth - rect.right; 

            menu.style.top = top + 'px';
            menu.style.right = right + 'px'; 
            menu.style.display = 'block';
            overlay.style.display = 'block';
        }

        function hideContextMenu() {
            document.getElementById('context-menu').style.display = 'none';
            document.getElementById('context-overlay').style.display = 'none';
        }

        // 下一首播放
        function fnPlayNext() {
            hideContextMenu();
            if(contextMenuTargetIndex === -1) return;

            const song = currentPlaylist[contextMenuTargetIndex];
            if(contextMenuTargetIndex === currentIndex) return;

            currentPlaylist.splice(contextMenuTargetIndex, 1);
            if(contextMenuTargetIndex < currentIndex) {
                currentIndex--;
            }
            currentPlaylist.splice(currentIndex + 1, 0, song);
            renderList(); 
        }

        // 下載
        function fnDownload() {
            hideContextMenu();
            if(contextMenuTargetIndex === -1) return;
            
            const song = currentPlaylist[contextMenuTargetIndex];
            const link = document.createElement('a');
            link.href = song.url;
            link.target = '_blank';
            link.download = song.filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // 移除
        function fnRemove() {
            hideContextMenu();
            if(contextMenuTargetIndex === -1) return;
            
            if(contextMenuTargetIndex === currentIndex) {
                nextSong();
            }

            currentPlaylist.splice(contextMenuTargetIndex, 1);
            if(contextMenuTargetIndex < currentIndex) {
                currentIndex--;
            }
            renderList();
        }

        function loadSong(index, autoPlay = true) {
            if (index < 0 || index >= currentPlaylist.length) return;
            const song = currentPlaylist[index];
            
            audio.src = song.url;
            readID3Tags(song);
            updateUI(song);

            if (autoPlay) {
                audio.play().catch(e => console.log("播放阻擋", e));
                setPlayingState(true);
            } else {
                setPlayingState(false);
            }
            renderList();
        }

        async function readID3Tags(song) {
            try {
                // 這裡使用了 AbortController 來確保只下載前 128KB
                const controller = new AbortController();
                const signal = controller.signal;
                const response = await fetch(song.url, { signal });
                if (!response.ok) return;

                const reader = response.body.getReader();
                let chunks = [];
                let receivedLength = 0;
                const LIMIT = 128 * 1024; // 128KB 限制

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    chunks.push(value);
                    receivedLength += value.length;
                    
                    // ★ 關鍵：超過 128KB 直接切斷連線！
                    if (receivedLength > LIMIT) {
                        controller.abort(); 
                        break;
                    }
                }
                const blob = new Blob(chunks);
                new jsmediatags.Reader(blob)
                    .setTagsToRead(["title", "artist"])
                    .read({
                        onSuccess: function(tag) {
                            const tags = tag.tags;
                            if (tags.title) {
                                document.getElementById('player-title').innerText = tags.title;
                                document.getElementById('mini-title').innerText = tags.title;
                                // 我們不覆蓋 song.title，保留完整檔名顯示
                            }
                            if (tags.artist) {
                                document.getElementById('player-artist').innerText = tags.artist;
                                document.getElementById('mini-artist').innerText = tags.artist;
                                // ★ 只有在讀到 tag 時才更新歌手，否則維持 Unknown
                                song.artist = tags.artist; 
                            }
                        },
                        onError: function(error) {}
                    });
            } catch (err) {}
        }

        function updateUI(song) {
            document.getElementById('mini-title').innerText = song.title;
            document.getElementById('mini-artist').innerText = song.artist;
            document.getElementById('mini-cover').src = song.cover;
            
            document.getElementById('player-title').innerText = song.title;
            document.getElementById('player-artist').innerText = song.artist;
            document.getElementById('player-cover').style.backgroundImage = `url('${song.cover}')`;
            playerBg.style.backgroundImage = `url('${song.cover}')`; 
            
            const favBtn = document.getElementById('player-fav-btn');
            if(favorites.includes(song.filename)) {
                favBtn.classList.add('active');
                favBtn.innerHTML = '<span class="material-icons-round">favorite</span>';
            } else {
                favBtn.classList.remove('active');
                favBtn.innerHTML = '<span class="material-icons-round">favorite_border</span>';
            }
        }

        function playSong() { loadSong(currentIndex, true); }

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                setPlayingState(true);
            } else {
                audio.pause();
                setPlayingState(false);
            }
        }

        function setPlayingState(isPlaying) {
            const icons = ['mini-play-icon', 'player-play-icon'];
            icons.forEach(id => document.getElementById(id).innerText = isPlaying ? 'pause' : 'play_arrow');
            if (isPlaying) {
                vinylRecord.classList.add('playing');
                toneArm.classList.add('playing');
            } else {
                vinylRecord.classList.remove('playing');
                toneArm.classList.remove('playing');
            }
        }

        function nextSong() {
            if (isShuffle) {
                currentIndex = Math.floor(Math.random() * currentPlaylist.length);
            } else {
                currentIndex = (currentIndex + 1) % currentPlaylist.length;
            }
            playSong();
        }

        function prevSong() {
            currentIndex = (currentIndex - 1 + currentPlaylist.length) % currentPlaylist.length;
            playSong();
        }
        
        function playRandom() {
            isShuffle = true;
            document.getElementById('shuffle-icon').style.color = 'var(--primary-color)';
            nextSong();
            openPlayer();
        }

        audio.ontimeupdate = () => {
            const percent = (audio.currentTime / audio.duration) * 100;
            document.getElementById('progress-bar').value = percent || 0;
            document.getElementById('curr-time').innerText = formatTime(audio.currentTime);
            document.getElementById('total-time').innerText = formatTime(audio.duration || 0);
        };
        
        audio.onended = () => {
            if (isRepeat) {
                audio.currentTime = 0;
                audio.play();
            } else {
                nextSong();
            }
        };

        document.getElementById('progress-bar').oninput = (e) => {
            const time = (e.target.value / 100) * audio.duration;
            audio.currentTime = time;
        };

        function formatTime(s) {
            const min = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${min}:${sec < 10 ? '0'+sec : sec}`;
        }

        function openPlayer() { document.getElementById('player-view').classList.add('active'); }
        function closePlayer() { document.getElementById('player-view').classList.remove('active'); }
        
        function toggleMenu() {
            const menu = document.getElementById('menu-options');
            menu.classList.toggle('show');
            document.addEventListener('click', function close(e) {
                if(!e.target.closest('.nav-bar')) {
                    menu.classList.remove('show');
                    document.removeEventListener('click', close);
                }
            });
        }

        function toggleFavorite() {
            const song = currentPlaylist[currentIndex];
            const idx = favorites.indexOf(song.filename);
            if (idx > -1) { favorites.splice(idx, 1); } 
            else { favorites.push(song.filename); }
            localStorage.setItem('myFavorites', JSON.stringify(favorites));
            updateUI(song); 
            renderList();   
        }

        function exportFavorites() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(favorites));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "my_fav_songs.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        function importFavorites(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        favorites = imported;
                        localStorage.setItem('myFavorites', JSON.stringify(favorites));
                        alert("導入成功！");
                        renderList();
                        if(currentPlaylist[currentIndex]) updateUI(currentPlaylist[currentIndex]);
                    } else {
                        alert("檔案格式錯誤");
                    }
                } catch (err) {
                    alert("讀取失敗");
                }
            };
            reader.readAsText(file);
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            document.getElementById('shuffle-icon').style.color = isShuffle ? 'var(--primary-color)' : 'white';
        }
        
        function toggleRepeat() {
            isRepeat = !isRepeat;
            document.getElementById('repeat-icon').style.color = isRepeat ? 'var(--primary-color)' : 'white';
            audio.loop = false; 
        }
    </script>
</body>
</html>
